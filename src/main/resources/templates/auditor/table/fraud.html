<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <title>bpdz</title>
  </head>
  <body>
    <nav>
      <div class="nav__header">
        <div class="nav__logo">
          <a class="logo">BPDZ</a>
        </div>
      </div>
      <ul class="nav__links" id="nav-links">
        <li><a href="/login" data-i18n="home_tr">HOME</a></li>
        <li class="dropdown">
          <a><span data-i18n="SERVICES_tr">SERVICES</span> <i class="ri-arrow-down-s-line"></i></a>
          <ul class="dropdown-content">
            <li class="dropdown-item">
              <a> <span data-i18n="ViewTables_tr">View Tables</span> <i class="ri-arrow-right-s-line"></i></a>
              <ul class="dropdown-submenu">
                <li><a href="/archive" data-i18n="Archive_tr">Archive</a></li>
                <li><a href="/movment" data-i18n="movements_tr">movement</a></li>
                <li><a href="/compte" data-i18n="accounts_tr">account</a></li>
                <li><a href="/dir" data-i18n="directory_tr">directory</a></li>
                <li><a href="/fraud" data-i18n="fraud_tr">fraud</a></li>
                <li><a href="/mondat" data-i18n="mondat_tr">mondat</a></li>
                <li><a href="/pret" data-i18n="loan_tr">loan</a></li>
                <li><a href="/habi" data-i18n="habilitation_tr">habilitation</a></li>
                <li><a href="/service" data-i18n="services_tr">service</a></li>
              </ul>
            </li>
            <li><a href="/auditor/add_auditor/add_audi" data-i18n="Add_table_tr">Add Table</a></li>
          </ul>
        </li>
      </ul>
      <div class="nav__btns">
        <li><a href="/profile">PROFILE</a></li>
        <select id="language-select" class="lang">
          <option value="en">EN</option>
          <option value="fr">FR</option>
        </select>
        <button id="toggleDarkMode" class="lang" data-i18n="dark_mode">Dark Mode</button>
      </div>
    </nav> 



    <form class="section__container search__input" th:action="@{/searchfraude}" th:object="${search}" method="POST">
      <h1 data-i18n="Tablefraud_tr"></h1>
        <input type="text" name="search" placeholder="Write" th:value="${search}">
        <button type="submit" data-i18n="Search_tr">Search</button>
    </form>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

          <table class="section__container">
            <thead>
                <tr>
                    <th data-i18n="id_tr">ID</th>
                    <th data-i18n="reason_tr">Reason</th>
                    <th data-i18n="info_interdite_tr">Information</th>
                    <th data-i18n="info_type_tr">Type</th>
                    <th>Date</th>
                    <th data-i18n="action_tr">Actions</th>
                </tr>
            </thead>
            <tbody>
              <tr th:each="fraude : ${fraude}">
                <td th:text="${fraude.id}"></td>
                <td th:text="${fraude.raison}"></td>
                <td th:text="${fraude.informationInterdite}"></td>
                <td th:text="${fraude.typeInformation}"></td>
                <td th:text="${fraude.dateInterdiction}"></td>
                <td>
                  <div class="action-links">
                            <form th:action="@{/operation/confirmdelete(id=${fraude.id}, type='fraud')}" method="get">
                                <input type="hidden" name="id" th:value="${fraude.id}" />
                                <input type="hidden" name="type" value="fraud" />
                                <button type="submit" data-i18n="delete_tr">Delete</button>
                            </form>
                            <form th:action="@{/operation/editFraud}" method="get">
                              <input type="hidden" name="id" th:value="${fraude.id}" />
                              <button type="submit" data-i18n="modify_tr">Change</button>
                            </form>
                    <a href="/admin/add/add_auditor/add_audi" class="add" data-i18n="add_tr">Add</a>
                </div>
                </td>
                </tr>
            </tbody>
        </table>

        <div class="section__container modify-form-container">
          <h2 data-i18n="modify_data_tr">Modify Data</h2>
          <form class="form-griddd" th:action="@{/operation/updatFraud}" th:object="${fraudToEdit}" method="post">
              
            <div class="form-grouppp">
              <label for="typeInformation" data-i18n="info_type_tr">Type information</label>
              <input type="text" th:field="*{typeInformation}">
            </div>
              
              <div class="form-grouppp">
                  <label for="idBanque" data-i18n="info_interdite_tr">Information Interdite</label>
                  <input type="text" th:field="*{informationInterdite}">
              </div>
              
              <div class="form-grouppp">
                  <label for="typeMessage" data-i18n="reason_tr">Reaison</label>
                  <input type="text" th:field="*{raison}">
              </div>

              <div class="form-grouppp">
                <label for="dateInterdiction">Date</label>
                <input type="date" th:field="*{dateInterdiction}">
            </div>
              
              <div class="form-actionsss"> 
                  <button type="submit" data-i18n="save_change_tr">Save Changes</button>
              </div>

          </form>
        </div>

<script src="/js/main.js"></script>
<script src="/js/language.js"></script>
<script src="/js/darkmode.js"></script>
</body>
</html>
