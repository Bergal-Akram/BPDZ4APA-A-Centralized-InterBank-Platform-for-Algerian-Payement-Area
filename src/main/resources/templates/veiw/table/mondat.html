<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <title>bpdz</title>
  </head>
  <body>
		<nav>
			<div class="nav__header">
			  <div class="nav__logo">
				<a class="logo">BPDZ</a>
			  </div>
			</div>
			<ul class="nav__links" id="nav-links">
			  <li><a href="/login" data-i18n="home_tr">HOME</a></li>
			  <li class="dropdown">
				<a><span data-i18n="SERVICES_tr">SERVICES</span> <i class="ri-arrow-down-s-line"></i></a>
				<ul class="dropdown-content">
				  <li class="dropdown-item">
					<a> <span data-i18n="ViewTables_tr">View Tables</span> <i class="ri-arrow-right-s-line"></i></a>
					<ul class="dropdown-submenu">
					  <li><a href="/archive" data-i18n="Archive_tr">Archive</a></li>
					  <li><a href="/movment" data-i18n="movements_tr">movement</a></li>
					  <li><a href="/compte" data-i18n="accounts_tr">account</a></li>
					  <li><a href="/dir" data-i18n="directory_tr">directory</a></li>
					  <li><a href="/fraud" data-i18n="fraud_tr">fraud</a></li>
					  <li><a href="/mondat" data-i18n="mondat_tr">mondat</a></li>
					  <li><a href="/pret" data-i18n="loan_tr">loan</a></li>
					  <li><a href="/habi" data-i18n="habilitation_tr">habilitation</a></li>
					  <li><a href="/service" data-i18n="services_tr">service</a></li>
					</ul>
				  </li>
				</ul>
			  </li>
			</ul>
			<div class="nav__btns">
			  <li><a href="/profile">PROFILE</a></li>
			  <select id="language-select" class="lang">
				<option value="en">EN</option>
				<option value="fr">FR</option>
			  </select>
			  <button id="toggleDarkMode" class="lang" data-i18n="dark_mode">Dark Mode</button>
			</div>
		  </nav> 

    <form class="section__container search__input" th:action="@{/searchmandat}" th:object="${search}" method="POST">
      <h1 data-i18n="TableMondat_tr"></h1>
        <input type="text" name="search" placeholder="Write"  th:value="${search}">
        <button type="submit" data-i18n="Search_tr">Search</button>
    </form>

<table class="section__container">
    <thead>
        <tr>
            <th data-i18n="id_tr">ID</th>
            <th data-i18n="Bank_ID_tr">ID Banque</th>
            <th data-i18n="ID_Compte_tr">ID Compte</th>
            <th data-i18n="ID_Mouvement_tr">ID Mouvement</th>
            <th data-i18n="Date_Mandat_tr">Date Mandat</th>
        </tr>
    </thead>
    <tbody>
      <tr th:each="mandat : ${mandat}">
        <td th:text="${mandat.id}"></td>
        <td th:text="${mandat.banque?.getBic()}"></td>
        <td th:text="${mandat.compte?.getId()}"></td>
        <td th:text="${mandat.mouvement?.getId()}"></td>
        <td th:text="${mandat.dateMandat}"></td>
        </tr>
    </tbody>
</table>



<script src="/js/main.js"></script>
<script src="/js/language.js"></script>
<script src="/js/darkmode.js"></script>
</body>
</html>
