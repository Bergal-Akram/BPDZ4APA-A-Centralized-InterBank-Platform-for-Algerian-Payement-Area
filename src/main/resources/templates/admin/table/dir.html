<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="/css/styles.css" />   
    <title>bpdz</title>
  </head>
  <body>
    <nav>
      <div class="nav__header">
        <div class="nav__logo">
          <a class="logo">BPDZ</a>
        </div>
      </div>
      <ul class="nav__links" id="nav-links">
        <li><a href="/login" data-i18n="home_tr">HOME</a></li>
        <li class="dropdown">
          <a><span data-i18n="SERVICES_tr">SERVICES</span> <i class="ri-arrow-down-s-line"></i></a>
          <ul class="dropdown-content">
            <li class="dropdown-item">
              <a> <span data-i18n="ViewTables_tr">View Tables</span> <i class="ri-arrow-right-s-line"></i></a>
              <ul class="dropdown-submenu">
                <li><a href="/archive" data-i18n="Archive_tr">Archive</a></li>
                <li><a href="/movment" data-i18n="movements_tr">movement</a></li>
                <li><a href="/compte" data-i18n="accounts_tr">account</a></li>
                <li><a href="/dir" data-i18n="directory_tr">directory</a></li>
                <li><a href="/fraud" data-i18n="fraud_tr">fraud</a></li>
                <li><a href="/mondat" data-i18n="mondat_tr">mondat</a></li>
                <li><a href="/pret" data-i18n="loan_tr">loan</a></li>
                <li><a href="/habi" data-i18n="habilitation_tr">habilitation</a></li>
                <li><a href="/service" data-i18n="services_tr">service</a></li>
              </ul>
            </li>
            <li><a href="/admin/add/add_auditor/add_audi" data-i18n="Add_table_tr">Add Table</a></li>
            <li><a href="/admin/add/add_compte/add_prof" data-i18n="Add_Account_tr">Add Account</a></li>
          </ul>
        </li>
      </ul>
      <div class="nav__btns">
        <li><a href="/profile">PROFILE</a></li>
        <select id="language-select" class="lang">
          <option value="en">EN</option>
          <option value="fr">FR</option>
        </select>
        <button id="toggleDarkMode" class="lang" data-i18n="dark_mode">Dark Mode</button>
      </div>
    </nav>  


    <form class="section__container search__input" th:action="@{/search}" th:object="${search}" method="POST">
      <h1 data-i18n="Tabledir_tr"></h1>
        <input type="text" name="search" placeholder="Write " th:value="${search}">
        <button type="submit" data-i18n="Search_tr"></button>
    </form>

    <div th:if="${successMessage}" class="alert alert-success">
      <p th:text="${successMessage}"></p>
    </div>
  

<table class="section__container">
    <thead>
        <tr>
            <th data-i18n="id_tr">ID</th>
            <th data-i18n="bank_name_tr"></th>
            <th data-i18n="code_bank_tr"></th>
            <th data-i18n="bic_tr"></th>
            <th data-i18n="Participantes_tr"></th>
            <th data-i18n="ISO20022_tr"></th>
            <th data-i18n="loan_tr"></th>
            <th data-i18n="Corresponding_Name_tr"></th>
            <th data-i18n="Email_tr"></th>
            <th data-i18n="Phone_tr"></th>
            <th data-i18n="Abonnement_tr"></th>
            <th data-i18n="action_tr"></th>
        </tr>
    </thead>
    <tbody>
      <tr th:each ="banks:${banks}">
        <td th:text="${banks.id}"></td>
            <td th:text="${banks.nomBanque}"></td>
            <td th:text="${banks.codeBanque}"></td>
            <td th:text="${banks.bic}"></td>
           
            <td th:text="${banks.participante}"></td>
             <td th:text="${banks.iso20022Integration}"></td>
              <td th:text="${banks.pret}"></td>
               <td th:text="${banks.nomCorrespondant}"></td>
                <td th:text="${banks.mail}"></td>
                <td th:text="${banks.tel}"></td>
                <td th:text="${banks.abonnement}"></td>
            <td>
              <div class="action-links">
				        <form th:action="@{/operation/confirmdelete(id=${banks.id}, type='dir')}" method="get">
                      <input type="hidden" name="id" th:value="${banks.id}" />
                      <input type="hidden" name="type" value="dir" />
                      <button type="submit" data-i18n="delete_tr">Delete</button>
                      </form>
				        <form th:action="@{/operation/editdir}" method="get">
                   <input type="hidden" name="id" th:value="${banks.id}" />
                   <button type="submit" class="modify" data-i18n="modify_tr">Change</button>
                </form>
            </div>
            </td>
        </tr>
    </tbody>
</table>

<!-- i will modify in input type i add this only to see it i will send code and only copy coller don't worry ok!-->
<div class="section__container modify-form-container">
  <h2>Modify Data</h2>
  <form class="form-griddd" th:action="@{/operation/updateDir}" th:object="${dirToEdit}" method="post">
      <div class="form-grouppp">
      <label>id</label>
      <input type="number" th:field="*{id}" />
      </div>
      <div class="form-grouppp">
          <label>Nom Banque</label>
          <input type="text" th:field="*{nomBanque}" />
      </div>
      
      <div class="form-grouppp">
          <label>Code Banque</label>
          <input type="text" th:field="*{codeBanque}" />
      </div>
      
      <div class="form-grouppp">
          <label>BIC</label>
          <input type="text" th:field="*{bic}" />
      </div>    
      
      <div class="form-grouppp">
          <label>Participante</label>
          <input type="text" th:field="*{participante}" />
      </div>
      
      <div class="form-grouppp">
          <label>ISO20022</label>
          <input type="text" th:field="*{iso20022Integration}" />
      </div>
      
      <div class="form-grouppp">
          <label>Prêt</label>
          <input type="text" th:field="*{pret}" />
      </div>

      <div class="form-grouppp">
          <label>Nom Correspondant</label>
          <input type="text" th:field="*{nomCorrespondant}" />
      </div>

      <div class="form-grouppp">
          <label>Email</label>
          <input type="text" th:field="*{mail}" />
      </div>

      <div class="form-grouppp">
          <label>Téléphone</label>
          <input type="number" th:field="*{tel}" />
      </div>
      
      <div class="form-grouppp">
          <label>Abonnement</label>
          <input type="text" th:field="*{abonnement}" />
      </div>
      
      <div class="form-actionsss">
          <button type="button" >Cancel</button>
          <button type="submit">Save Changes</button>
      </div>
  </form>
</div>
<script src="/js/main.js"></script>
<script src="/js/language.js"></script>
<script src="/js/darkmode.js"></script>
</body>
</html>
