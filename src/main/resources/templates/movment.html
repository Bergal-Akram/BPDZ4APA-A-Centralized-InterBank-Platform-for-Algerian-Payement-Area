<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/form.css" />
    <title>bpdz</title>
  </head>
  <body>
    <nav>
        <div class="nav__header">
          <div class="nav__logo">
            <a class="logo">BPDZ</a>
          </div>
        </div>
        <ul class="nav__links" id="nav-links">
          <li><a href="/login" data-i18n="home_tr">HOME</a></li>
          <li class="dropdown">
            <a><span data-i18n="SERVICES_tr">SERVICES</span> <i class="ri-arrow-down-s-line"></i></a>
            <ul class="dropdown-content">
      <li><a href="/form">Fill Pacs</a></li>
      <li><a href="/movment">Transfer</a></li>
            </ul>
          </li>
        </ul>
        <div class="nav__btns">
          <li><a href="/profile">PROFILE</a></li>
          
          <select id="language-select" class="lang">
            <option value="en">EN</option>
            <option value="fr">FR</option>
          </select>
          <button id="toggleDarkMode" class="lang" data-i18n="dark_mode">Dark Mode</button>
        </div>
      </nav>  
	


 <form class="section__container search__input"  th:action="@{/searchpret}" th:object="${search}" method="POST">
      <h1 data-i18n="TablePret_tr"> Transfer Table </h1>
        <input type="text" name="search" placeholder="Write" th:value="${search}" >
        <button type="submit" data-i18n="Search_tr">Search</button>
    </form>
<table>
    <thead>
         <tr>
                <th>id</th>    
                <th>Nature</th>            
                <th>Type Message</th>           
                <th>Infos</th>          
                <th>banque Recepteur</th>
                <th>banque Emetteur</th>            
                <th>XML</th>
                <th>Action</th>
				
            </tr>
    </thead>
    <tbody>
            <tr th:each = "trans:${trans}"> 
            <td th:text="${trans.id}"></td>      
            <td th:text="${trans.natureMouvement}"></td>         
            <td th:text="${trans.typeMessage}"></td>           
            <td th:text="${trans.informationsMessage}"></td>
            <td th:text="${trans.banqueRecepteur?.getBic()}"></td>
            <td th:text="${trans.banqueEmetteur?.getBic()}"></td>         
            <td th:text="${trans.xmlFile}"></td>
             <td><form th:action="@{/Pacs/download}" method="get">
                   <input type="hidden" name="xml" th:value="${trans.xmlFile}" />
                    <input type="hidden" name="pacs" th:value="${trans.typeMessage}" />
                   <button type="submit">download</button>
                 </form></td>
			               
        </tr>
    </tbody>
</table>

<script src="/js/main.js"></script>
</body>
</html>
